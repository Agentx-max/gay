<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-gold: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%);
            --accent-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            overflow: hidden;
            color: var(--text-main);
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .card-container {
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 420px;
            max-width: 90vw;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 35px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
            position: relative;
        }

        .btn {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            outline: none;
            user-select: none;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: #0f172a;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Step Visibility Controls */
        #step2, #step3 {
            display: none;
        }

        /* Dynamic Position for Runaway Button */
        #noBtn2 {
            z-index: 1000;
            white-space: nowrap;
        }

        .result-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        .sub-text {
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Step 1: Question 1 -->
        <div class="glass-card" id="step1">
            <span class="badge">Question 01</span>
            <h2>Are you boy?</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="goToStep2()">Yes</button>
                <button class="btn btn-secondary" onclick="goToStep2()">No</button>
            </div>
        </div>

        <!-- Step 2: Question 2 (Prank Page) -->
        <div class="glass-card" id="step2">
            <span class="badge">Question 02</span>
            <h2>Are you Gay?</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="finishPrank()">Yes</button>
                <button class="btn btn-secondary" id="noBtn2" onmouseover="moveButton()" ontouchstart="moveButton(event)" onclick="moveButton()">No</button>
            </div>
        </div>

        <!-- Step 3: Final Prank Result -->
        <div class="glass-card" id="step3">
            <span class="result-icon">✨</span>
            <span class="badge">Confirmed</span>
            <h2>I knew it! 😂</h2>
            <p class="sub-text">Thanks for your honesty! 😉🎉</p>
        </div>
    </div>

    <script>
        function goToStep2() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function moveButton(event) {
            if (event) {
                event.preventDefault(); // Phone එකේ touch කරද්දී click එක register වීම වළක්වයි
            }

            const noBtn = document.getElementById('noBtn2');
            
            // Screen එකේ දාරවලින් ඇතුළත ආරක්ෂිත සීමාවන් (Padding)
            const padding = 20;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            // Screen එකෙන් පිටතට නොයන පරිදි ඛණ්ඩාංක සෑදීම
            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transition = 'all 0.2s ease-out';
        }

        function finishPrank() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        }
    </script>

</body>
</html>
